# Sweep++ channels -- FPV video links
#
# Analog channel plans from a catalogue of published vendor tables: every plan
# that appeared on at least eight devices, in the vendor's own channel order,
# so channel 1 of a band is the frequency its manual calls channel 1. A plan
# whose published row repeats a frequency or breaks its own run is a
# transcription error rather than a band, and is not here.
#
# Band letters are not consistent between vendors. The letter on a group is
# whichever one most of them print for that plan, and the labels they use
# instead are on the group's description. Where two genuinely different plans
# claim one letter inside a band -- 3.3 GHz has three "B" -- the plan on the
# most devices keeps the plain letter and the others carry their range, because
# dropping one would drop a plan somebody's VTX is tuned to.
#
# Every analog channel is 12 MHz wide. That is the occupied bandwidth of the
# video carrier rather than the channel spacing, and it is the same at every
# one of these carriers.
#
# The digital branch is authored from published operating ranges and nominal
# channel bandwidths. Indicative, for navigation: what a link actually occupies
# depends on its mode and its region.
#
# A user file of the same [channels].id in the config directory replaces this
# one outright.

[channels]
id = "fpv"
name = "FPV video"
description = "Analog and digital video links"
width = "12 MHz"

[channels.colors]
analog = "#F97316"
digital = "#38BDF8"

