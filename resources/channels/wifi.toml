# Sweep++ channels -- Wi-Fi
#
# Channel centres from the IEEE 802.11 channel plans. Which of them are legal
# where you are is a national question: the 5 GHz DFS sub-bands and the whole
# of 6 GHz differ by region, and this file lists the plan rather than a
# permission.
#
# Widths are the 20 MHz base channel. A link bonded to 40, 80 or 160 MHz
# occupies its centre channel and its neighbours.
#
# A user file of the same [channels].id in the config directory replaces this
# one outright.

[channels]
id = "wifi"
name = "Wi-Fi"
description = "802.11 channels, 2.4 through 6 GHz"
width = "20 MHz"

[channels.colors]
ghz24 = "#3B82F6"
ghz5 = "#6366F1"
ghz6 = "#8B5CF6"
halow = "#0EA5E9"

[[group]]
id = "24"
name = "2.4 GHz"
color = "ghz24"
