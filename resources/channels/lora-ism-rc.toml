# Sweep++ channels -- LoRa, the ISM bands and RC links
#
# LoRaWAN channels are the default channel plans from the regional parameters;
# a network may add channels of its own, and which regional plan applies is a
# national question. The SRD and ISM entries are the shared allocations those
# channels sit inside, so a signal can be placed even when it belongs to none
# of the named plans.
#
# The RC-link entries are hopping systems: they occupy their whole range a few
# hundred microseconds at a time rather than sitting on one channel, which is
# why they are written as bands.
#
# A user file of the same [channels].id in the config directory replaces this
# one outright.

[channels]
id = "lora-ism-rc"
name = "LoRa and ISM"
description = "LoRaWAN channel plans, the SRD and ISM bands, and RC links"

[channels.colors]
lora = "#22C55E"
ism = "#84CC16"
rc = "#EAB308"

