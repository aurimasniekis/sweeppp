# Sweep++ channels -- cellular, Bluetooth and Zigbee
#
# The cellular blocks are the band edges from 3GPP, uplink and downlink kept
# apart because which of the two is on the air at a given place is the whole
# question when a handset is being looked for. Which bands are actually
# deployed is national, and several of these overlap by design.
#
# Indicative, for navigation: this is not an allocation table and not a
# licence.
#
# A user file of the same [channels].id in the config directory replaces this
# one outright.

[channels]
id = "cellular"
name = "Cellular and short range"
description = "GSM, LTE and 5G NR blocks, Bluetooth and Zigbee channels"

[channels.colors]
gsm = "#A855F7"
lte = "#C084FC"
nr = "#E879F9"
ble = "#EC4899"
zigbee = "#F472B6"

