# Sweep++ band plan -- ITU Region 1 (Europe, Africa, Middle East, northern Asia)
#
# Allocations are indicative and simplified for display. National regulations
# differ; this is a navigation aid, not a legal reference.
#
# A user file of the same name in the config directory replaces this one.
#
# Each [[band]] takes name, start, stop, group, and optionally:
#
#   description  a sentence, shown when the marker's chip is hovered
#   type         "band" (the default), "channel" or "spot"
#
# The type is what tells a wide allocation apart from a specific channel inside
# it, and the host draws the three differently. A "spot" is one frequency -- a
# beacon, a repeater output -- and gives no stop.

[bandplan]
name = "ITU Region 1"
description = "Common allocations across Europe, Africa and the Middle East"
region = "ITU-1"

# Colours group bands by service, so a glance at the spectrum tells you what
# kind of thing you are looking at rather than only its name.
[bandplan.colors]
"Broadcasting"    = "#8B5CF6"
"Amateur"         = "#22C55E"
"Mobile"          = "#3B82F6"
"ISM"             = "#F59E0B"
"Aeronautical"    = "#EF4444"
"Maritime"        = "#06B6D4"
"Satellite"       = "#EC4899"
"Radionavigation" = "#84CC16"
"Public safety"   = "#F97316"

