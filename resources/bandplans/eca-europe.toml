# Sweep++ band plan -- European Common Allocation (ECA)
#
# Generated from ERC Report 25, "The European Table of Frequency Allocations
# and Applications in the Frequency Range 8.3 kHz to 3000 GHz", approved
# October 2021, editorial update 10 March 2023, published by the ECC within
# CEPT.
#
# The ECA is what CEPT administrations have harmonised on, not what any one
# country has licensed: national tables differ, and this remains a navigation
# aid rather than a legal reference.
#
# A band is named by what the table says is *used* there -- its Applications
# column -- because that is the question an operator is asking. The formal
# allocation is in the description, primary services first. Allocations nothing
# on the ground transmits in are left out: passive services, inter-satellite,
# radio astronomy.
#
# A user file of the same name in the config directory replaces this one.

[bandplan]
name = "ECA (Europe)"
description = "The European Common Allocation table, ERC Report 25"
region = "CEPT"

[bandplan.colors]
"Broadcasting"    = "#8B5CF6"
"Amateur"         = "#22C55E"
"Mobile"          = "#3B82F6"
"Fixed"           = "#0EA5E9"
"Aeronautical"    = "#EF4444"
"Maritime"        = "#06B6D4"
"Satellite"       = "#EC4899"
"Radionavigation" = "#84CC16"
"Radiolocation"   = "#F59E0B"
"Meteorological"  = "#14B8A6"
"Radio astronomy" = "#A855F7"
"Time signals"    = "#EAB308"
"Other"           = "#94A3B8"

